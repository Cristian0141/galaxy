<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵💖 De mi Cristian 🎵💖</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(circle at top,#ff7abf,#270021,#000);
    color:white;
    font-family:'Segoe UI',sans-serif;
    text-align:center;
    overflow:hidden;
}

/* FONDO */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,105,180,.35), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.15), transparent 25%);
    animation:fondoMover 8s infinite alternate;
    z-index:-2;
}

@keyframes fondoMover{
    from{filter:hue-rotate(0deg);}
    to{filter:hue-rotate(20deg);}
}

/* VIDEOS */
.lado-video{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:120px;
    height:200px;
    object-fit:cover;
    border-radius:20px;
    box-shadow:0 0 25px #ff69b4;
    z-index:5;
}

#video-izq{left:4%;}
#video-der{right:4%;}

/* TITULOS */
h1{
    margin-top:10px;
    color:#ffc1e3;
    text-shadow:0 0 15px #ff1493;
}

.subtitulo{
    color:#ffd6ec;
    margin-bottom:10px;
}

/* AUDIO */
audio{
    width:90%;
    max-width:500px;
}

/* KARAOKE */
.karaoke{
    width:90%;
    max-width:500px;
    height:55vh;
    margin:auto;
    overflow-y:auto;
    padding:15px;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
}

.linea{
    opacity:0.3;
    margin:8px 0;
}

.linea.activa{
    opacity:1;
    font-size:1.3em;
    text-shadow:0 0 10px #ff69b4;
}

/* BOTON */
.boton-volver{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);
    background:#ff4f9a;
    padding:10px 15px;
    border-radius:20px;
    color:white;
    text-decoration:none;
}

/* 📱 CELULAR MEJORADO */
@media(max-width:768px){
    .lado-video{
        width:75px;
        height:125px;
        top:42%;
        z-index:10;
    }

    #video-izq{left:3%;}
    #video-der{right:3%;}

    .karaoke{
        width:82%;
        height:48vh;
    }
}

@media(max-width:480px){
    .lado-video{
        width:68px;
        height:110px;
        top:50%;
    }

    .karaoke{
        width:78%;
        height:45vh;
    }

    .linea{font-size:.9em;}
    .linea.activa{font-size:1.05em;}
}
</style>
</head>

<body>

<!-- VIDEO IZQUIERDO -->
<img 
src="https://dl.dropboxusercontent.com/scl/fi/traqxpsas86q1w2glqs3k/video1.webp?rlkey=j0ucgojwm6alaqmvhizyqtb0h&st=u6i3d77s"
class="lado-video"
id="video-izq">

<!-- VIDEO DERECHO -->
<video autoplay loop muted playsinline class="lado-video" id="video-der">
    <source src="https://dl.dropboxusercontent.com/scl/fi/alha21huq48mlsyr3hufv/video2.mp4?rlkey=tfdi95bg74kxz6pqpc08akn1s&st=uj8f497s" type="video/mp4">
</video>

<h1>🎵💖 De mi Cristian 🎵💖</h1>
<h2 class="subtitulo">💖 Para ti Lucy :3 💖</h2>

<audio id="audio" controls>
    <source src="https://dl.dropboxusercontent.com/scl/fi/h07pjfnxdfc9mm6zosjzd/musica1.mp3?rlkey=rfbtmmx4w5lydemu3kyii7vac&st=dr4621zy" type="audio/mpeg">
</audio>

<div class="karaoke" id="karaoke"></div>

<a href="index.html" class="boton-volver">🌌 Volver</a>

<script>
const letra=[
{t:15,texto:"Y si te parece que"},
{t:17,texto:"Yo estoy enamorado tuyo"},
{t:20,texto:"Eso es un invento, intuyo"},
{t:22,texto:"No des crédito a murmullos"},
{t:24,texto:"Porque casi nunca llamo"},
{t:27,texto:"Para decir que te amo"},
{t:30,texto:"Y más de una vez lo hice"},
{t:32,texto:"A un número equivocado"},
{t:35,texto:"Casi nunca nadie dice"},
{t:37,texto:"Que yo estoy enamorado tuyo"},
{t:75,texto:"No te vistas, no te hagás la nunca vista"},
{t:80,texto:"Tengo en vista a cantarte un"},
{t:83,texto:"Hasta la vista"},
{t:90,texto:"Tengo lista una canción que dice"},
{t:93,texto:"Hasta la vista, señorita 💖"}
];

const karaoke=document.getElementById("karaoke");
const audio=document.getElementById("audio");

letra.forEach((l,i)=>{
    let p=document.createElement("p");
    p.className="linea";
    p.textContent=l.texto;
    p.id="l"+i;
    karaoke.appendChild(p);
});

audio.addEventListener("timeupdate",()=>{
    let actual=0;

    for(let i=0;i<letra.length;i++){
        if(audio.currentTime>=letra[i].t){
            actual=i;
        }
    }

    document.querySelectorAll(".linea").forEach(l=>l.classList.remove("activa"));

    let activa=document.getElementById("l"+actual);
    if(activa){
        activa.classList.add("activa");
        activa.scrollIntoView({behavior:"smooth",block:"center"});
    }
});
</script>

</body>
</html>
